<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Opções - 99Freelas Proposal Prefill</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-body">
    <main class="options-layout">
      <section class="panel wide">
        <h1>Configurações da extensão</h1>
        <p class="subtitle">
          Tudo aqui fica salvo localmente no seu Chrome.
        </p>

        <div class="form-grid">
          <label class="field">
            <span>Gemini API Key</span>
            <input id="geminiApiKey" type="password" placeholder="Cole sua chave do Gemini" />
          </label>

          <label class="field">
            <span>Modelo Gemini</span>
            <input id="geminiModel" type="text" placeholder="gemini-2.5-flash" />
          </label>

          <label class="field">
            <span>Nome do freelancer</span>
            <input id="displayName" type="text" />
          </label>

          <label class="field">
            <span>Headline</span>
            <input id="headline" type="text" />
          </label>

          <label class="field full">
            <span>Resumo profissional</span>
            <textarea id="portfolioSummary" rows="4"></textarea>
          </label>

          <label class="field">
            <span>Valor mínimo da proposta (R$)</span>
            <input id="minProposalAmountBrl" type="number" min="1" step="1" />
          </label>

          <label class="field">
            <span>Desconto sobre a média do 99Freelas</span>
            <input id="discountAgainstAverage" type="number" min="0" max="0.9" step="0.05" />
          </label>

          <label class="field">
            <span>Prazo mínimo (dias)</span>
            <input id="minDeadlineDays" type="number" min="1" step="1" />
          </label>
        </div>

        <div class="actions">
          <button id="saveButton" class="primary-button">Salvar configurações</button>
        </div>

        <div id="optionsStatus" class="status"></div>
      </section>
    </main>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
